# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=true
# Temporary safety net: the versioning plugin (nemerosa/versioning#97) makes JGit
# fork `git` twice during configuration, which the Configuration Cache rejects.
# Set GIT_CONFIG_NOSYSTEM=true in the Gradle daemon's environment (see CLAUDE.md)
# and remove this override once that is standard, so real problems fail the build.
org.gradle.configuration-cache-problems=warn
org.gradle.parallel=true
org.gradle.parallel.threads=8
org.gradle.caching=true

########## Properties for publishing to Maven Central ##########

mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
mavenCentralDeploymentValidation=NONE
signAllPublications=true

