pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == "org.openrewrite") {
                useModule("org.openrewrite:plugin:${requested.version}")
            }
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = uri("https://artifacts.codegenomeproject.org/maven")
            credentials {
                username = providers.gradleProperty("codeGenomeUsername").get()
                password = providers.gradleProperty("codeGenomeToken").get()
            }
        }

    }
    // Include 'plugins build' to define convention plugins.
    includeBuild('build-logic')
}


plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}


dependencyResolutionManagement {
    repositoriesMode.set( RepositoriesMode.FAIL_ON_PROJECT_REPOS )
    // repositoriesMode.set( RepositoriesMode.PREFER_PROJECT )
    // repositoriesMode.set( RepositoriesMode.PREFER_SETTINGS )
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        // maven {
        //     name = "reposiliteRepository"
        //     url = "http://127.0.0.1:8081/"
        // }
        maven {
            url = uri("https://artifacts.codegenomeproject.org/maven")
            credentials {
                username = providers.gradleProperty("codeGenomeUsername").get()
                password = providers.gradleProperty("codeGenomeToken").get()
            }
        }
    }
}


rootProject.name = 'rail-base'
include('app', 'list', 'utilities')
