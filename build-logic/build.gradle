plugins {
    // Support convention plugins written in Groovy. Convention plugins are build scripts in 'src/main' that automatically become available as plugins in the main build.
    id 'groovy-gradle-plugin'
}

// `check` runs the Groovy checks only. PIT mutation testing is a project-level analysis
// task in the module builds (see buildlogic.java-common-conventions), not a testing suite,
// so it cannot be wired in here. (A previous `testing.suites.named('pitest')` reference
// here failed with "TestSuite with name 'pitest' not found".)
