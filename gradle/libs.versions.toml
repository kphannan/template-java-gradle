
## ====================================
## ====================================
## ----- Versions -----
[versions]

    # ===== Annotation Processors =====

    #   --- JSepcify - tool neutral null checks
    jspecifyVersion     = '1.0.0'

    #   --- boilerplate methods
    lombokVersion       = '9.2.0'

    #   --- Commons Text ---
    commonsTextVersion     = '1.14.0'

    #   --- OpenRewrite Java ---
    openRewriteJavaVersion = '8.93.0'

    #   --- FindSecBugs ---
    findsecbugsVersion     = '1.4.4'

    #   --- SpotBugs Annotations ---
    spotbugsAnnotationsVersion = '4.10.5'

    #   --- SB-Contrib ---
    sbContribVersion       = '7.7.4'

    # ===== Static Analysis =====


    #   --- Coding practices (static analysis) ---

    #   --- Coding style
    checkstyleVersion   = '14.3.0'

    #   --- Commmon coding flaws ---
    pmdVersion          = '7.28.0'
    spotbugsVersion     = '6.5.11'   #'6.0.26'


    # ===== Dynamic Analysis =====

    #   --- Unit Testing ---
    # --- Unit Testing ---
    assertjVersion      = '4.0.0-M1'
    logcaptorVersion    = '2.10.2'


    #   --- Mutation Testing (pitest) ---
    pitPluginVersion    = '1.19.0'
    pitVersion          = '1.30.1'
    junit5PluginVersion = '1.2.3'

    # ===== Code format =====

    #   --- Spotless ---
    spotlessVersion     = '8.11.0'
    #   --- OpenRewrite ---
    openRewriteVersion  = '7.44.0'

    # ===== SCM =====
    nemerosaVersion = '4.0.1'



## ====================================
## ====================================
## ----- Libraries -----
[libraries]

    #   --- Commons Text ---
    commonsText = { module = 'org.apache.commons:commons-text', version.ref = 'commonsTextVersion' }

    #   --- OpenRewrite Java ---
    openRewriteJava = { module = 'org.openrewrite:rewrite-java', version.ref = 'openRewriteJavaVersion' }

    #   --- FindSecBugs ---
    findsecbugs = { module = 'com.h3xstream.findsecbugs:findsecbugs-plugin', version.ref = 'findsecbugsVersion' }

    #   --- SpotBugs Annotations ---
    spotbugsAnnotations = { module = 'com.github.spotbugs:spotbugs-annotations', version.ref = 'spotbugsAnnotationsVersion' }

    #   --- SB-Contrib ---
    sbContrib = { module = 'com.mebigfatguy.sb-contrib:sb-contrib', version.ref = 'sbContribVersion' }

    # ----- Annotation Processor -----
    #   --- JSpecify (Stanard Annotations) ---
    jspecify = { module = 'org.jspecify:jspecify', version.ref = 'jspecifyVersion' }

    # --- Unit Testing ---
    assertj = { module = 'org.assertj:assertj-core', version.ref = 'assertjVersion' }
    logcaptor = { group = 'io.github.hakky54', name = 'logcaptor', version.ref = 'logcaptorVersion' }

    # --- Mutation Testing (PIT) ---
    # The plugin adds its default pitest core (1.22.x); these catalog pins take precedence.
    pitest-core = { module = 'org.pitest:pitest-command-line', version.ref = 'pitVersion' }
    pitest-junit5 = { module = 'org.pitest:pitest-junit5-plugin', version.ref = 'junit5PluginVersion' }



## ====================================
## ====================================
## ----- Bundles -----
[bundles]

    unit-test = [ 'assertj', 'logcaptor' ]


## ====================================
## ====================================
## ----- Plugins -----
[plugins]

    # ----- Coding support -----
    #   --- boilerplate generation ---
    lombok = { id = 'io.freefair.lombok', version.ref = 'lombokVersion' }


    # ----- Static Analysis -----

    # --- Code Style ---
    checkstyle = { id = 'checkstyle' }
    # --- Common Defects ---
    pmd = { id = 'pmd' }
    spotbugs = { id = 'com.github.spotbugs', version.ref = 'spotbugsVersion' }

    # ----- Runtime Analysis -----
    # --- Code Coverage ---
    jacoco = { id = 'jacoco' }


    #   --- Mutation testing ---
    pitest = { id = 'info.solidsoft.pitest', version.ref = 'pitPluginVersion' }

    #   --- Spotless ---
    spotless = { id = 'com.diffplug.spotless', version.ref = 'spotlessVersion' }

    # --- OpenRewrite ---
    openRewrite = { id = 'org.openrewrite.rewrite', version.ref = 'openRewriteVersion' }

    # ----- SCM -----
    gradleGit = { id = 'net.nemerosa.versioning', version.ref = 'nemerosaVersion' }
